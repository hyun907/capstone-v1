[project]
name = "capstone-v1"
version = "0.1.0"
description = "AI Agent 개인 실습"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastmcp==3.2.4",
    "httpx==0.28.1",
    "pydantic==2.11.7",
]

[project.optional-dependencies]
vector = [
    "fastembed==0.9.0",
]
backend = [
    "fastapi>=0.118,<1",
    "langchain>=1,<2",
    "langchain-mcp-adapters>=0.1.12,<1",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langsmith>=0.14,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.34,<1",
]
